<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CVS Receipt</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 350px;
  margin: auto;
  padding: 20px;
}

.header {
  text-align: center;
  margin-bottom: 10px;
}

.store {
  text-align: center;
  font-size: 14px;
  margin-bottom: 15px;
}

.row {
  display: flex;
  justify-content: space-between;
  margin: 4px 0;
}

.total {
  font-weight: bold;
  border-top: 1px dashed black;
  padding-top: 5px;
  margin-top: 10px;
}

.footer {
  margin-top: 20px;
  font-size: 12px;
  text-align: center;
}
</style>

</head>

<body>

<div class="header">
  <img src="cvslogo.png" alt="CVS Logo" style="height:40px;">
</div>

<div class="store">
  19701 Vanowen St
</div>

<div class="row">
  <div>RX Tranexamic Acid 500mg</div>
  <div>$77.00</div>
</div>

<div class="row" style="color:#666;">
  <div>Sales Tax</div>
  <div>$7.32</div>
</div>

<div class="row total">
  <div>Total</div>
  <div>$84.32</div>
</div>

<div class="row" style="font-size:14px; margin-top:5px;">
  <div>Payment Method</div>
  <div>Apple Pay • Visa 8559</div>
</div>

<div class="footer">
  Thanks for choosing CVS Pharmacy, copy of receipt sent to *****019@gmail.com.
</div>

</body>
</html>
